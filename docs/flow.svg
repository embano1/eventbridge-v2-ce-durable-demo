<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="1120" height="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Package review flow: CLI, EventBridge v2 bus, durable inspector, dispatcher, trail</title>
  <style>
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .line { stroke: #59636e; fill: none; stroke-width: 1.5; }
    .ext-line { stroke: #8c959f; fill: none; stroke-width: 1.25; stroke-dasharray: 4 4; }
    .head { fill: #59636e; }
    .actor { fill: #fff8c5; stroke: #bf8700; }
    .bus { fill: #fdf2f8; stroke: #e7157b; }
    .sub { fill: #ffffff; stroke: #e7157b; }
    .lambda { fill: #fff4e5; stroke: #ed7100; }
    .panel { fill: #fffaf3; stroke: #ed7100; }
    .step { fill: #ffffff; stroke: #ed7100; }
    .wait { fill: #fff1f0; stroke: #cf222e; }
    .ext { fill: #f6f8fa; stroke: #8c959f; }
    .bus-title { fill: #c0106a; }
    .panel-title { fill: #b35400; }
    .wait-title { fill: #a40e26; }
    .label-bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .ext-line { stroke: #6e7681; }
      .head { fill: #9198a1; }
      .actor { fill: #2e2a12; stroke: #d29922; }
      .bus { fill: #2a1320; stroke: #f25ca2; }
      .sub { fill: #1a0f16; stroke: #f25ca2; }
      .lambda { fill: #2b1d0e; stroke: #f0883e; }
      .panel { fill: #1f170e; stroke: #f0883e; }
      .step { fill: #161b22; stroke: #f0883e; }
      .wait { fill: #2d1215; stroke: #f85149; }
      .ext { fill: #161b22; stroke: #6e7681; }
      .bus-title { fill: #f778ba; }
      .panel-title { fill: #ffa657; }
      .wait-title { fill: #ff7b72; }
      .label-bg { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <!-- producers and the trail function -->
  <rect class="actor" x="20" y="140" width="170" height="50" rx="25" stroke-width="1.5"/>
  <text class="text" x="105" y="162" text-anchor="middle" font-size="14" font-weight="600">demo release</text>
  <text class="muted" x="105" y="179" text-anchor="middle" font-size="11">Go CLI</text>

  <rect class="actor" x="20" y="327" width="170" height="50" rx="25" stroke-width="1.5"/>
  <text class="text" x="105" y="349" text-anchor="middle" font-size="14" font-weight="600">demo review</text>
  <text class="muted" x="105" y="366" text-anchor="middle" font-size="11">human reviewer</text>

  <rect class="lambda" x="20" y="405" width="170" height="50" rx="8" stroke-width="1.5"/>
  <text class="text" x="105" y="427" text-anchor="middle" font-size="14" font-weight="600">trail</text>
  <text class="muted" x="105" y="444" text-anchor="middle" font-size="11">Lambda (Go) · logs every event</text>

  <!-- bus -->
  <rect class="bus" x="250" y="30" width="230" height="460" rx="12" stroke-width="1.5"/>
  <text class="bus-title" x="365" y="58" text-anchor="middle" font-size="14" font-weight="700">EventBridge v2 bus</text>
  <text class="muted" x="365" y="76" text-anchor="middle" font-size="11">package-review · CloudEvents as JSON</text>

  <rect class="sub" x="270" y="112" width="190" height="106" rx="8" stroke-width="1.5"/>
  <text class="text" x="365" y="136" text-anchor="middle" font-size="13" font-weight="600">workflow subscriber</text>
  <text class="muted" x="365" y="157" text-anchor="middle" font-size="11">FIFO · type package.released</text>
  <text class="muted" x="365" y="175" text-anchor="middle" font-size="11">DedupId = CloudEvent id</text>
  <text class="muted" x="365" y="193" text-anchor="middle" font-size="11">execution name = CloudEvent id</text>

  <rect class="sub" x="270" y="322" width="190" height="60" rx="8" stroke-width="1.5"/>
  <text class="text" x="365" y="346" text-anchor="middle" font-size="13" font-weight="600">dispatch subscriber</text>
  <text class="muted" x="365" y="365" text-anchor="middle" font-size="11">type review.decided</text>

  <rect class="sub" x="270" y="400" width="190" height="60" rx="8" stroke-width="1.5"/>
  <text class="text" x="365" y="424" text-anchor="middle" font-size="13" font-weight="600">trail subscriber</text>
  <text class="muted" x="365" y="443" text-anchor="middle" font-size="11">all four event types</text>

  <!-- producer and trail arrows -->
  <path class="line" d="M190,165 H250" marker-end="url(#a)"/>
  <path class="line" d="M190,352 H250" marker-end="url(#a)"/>
  <path class="line" d="M270,430 H190" marker-end="url(#a)"/>

  <!-- externals -->
  <rect class="ext" x="555" y="22" width="120" height="44" rx="8" stroke-width="1.25"/>
  <text class="text" x="615" y="41" text-anchor="middle" font-size="13" font-weight="600">GitHub</text>
  <text class="muted" x="615" y="57" text-anchor="middle" font-size="11">compare API</text>

  <rect class="ext" x="715" y="22" width="120" height="44" rx="8" stroke-width="1.25"/>
  <text class="text" x="775" y="41" text-anchor="middle" font-size="13" font-weight="600">Jev</text>
  <text class="muted" x="775" y="57" text-anchor="middle" font-size="11">decider model</text>

  <!-- inspector -->
  <rect class="panel" x="530" y="100" width="570" height="200" rx="12" stroke-width="1.5"/>
  <text class="panel-title" x="1085" y="124" text-anchor="end" font-size="13" font-weight="700">inspector · Lambda durable function (Go)</text>

  <rect class="step" x="555" y="142" width="120" height="46" rx="6" stroke-width="1.5"/>
  <text class="text" x="615" y="170" text-anchor="middle" font-size="13" font-weight="600">fetch-diff</text>

  <rect class="step" x="715" y="142" width="120" height="46" rx="6" stroke-width="1.5"/>
  <text class="text" x="775" y="170" text-anchor="middle" font-size="13" font-weight="600">classify</text>

  <rect class="step" x="955" y="142" width="120" height="46" rx="6" stroke-width="1.5"/>
  <text class="text" x="1015" y="170" text-anchor="middle" font-size="13" font-weight="600">emit-verdict</text>

  <rect class="wait" x="800" y="228" width="140" height="52" rx="6" stroke-width="1.5"/>
  <text class="wait-title" x="870" y="250" text-anchor="middle" font-size="13" font-weight="600">human-review</text>
  <text class="muted" x="870" y="267" text-anchor="middle" font-size="11">wait for callback · 24h</text>

  <path class="ext-line" d="M615,66 V142" marker-end="url(#a)"/>
  <path class="ext-line" d="M775,66 V142" marker-end="url(#a)"/>

  <path class="line" d="M460,165 H555" marker-end="url(#a)"/>
  <path class="line" d="M675,165 H715" marker-end="url(#a)"/>
  <path class="line" d="M835,165 H955" marker-end="url(#a)"/>
  <rect class="label-bg" x="852" y="146" width="86" height="14" rx="3"/>
  <text class="muted" x="895" y="157" text-anchor="middle" font-size="11">clear score</text>
  <path class="line" d="M800,188 C800,210 820,214 835,228" marker-end="url(#a)"/>
  <text class="muted" x="760" y="214" text-anchor="middle" font-size="11">0.2 – 0.8</text>
  <path class="line" d="M905,228 C920,212 985,210 985,188" marker-end="url(#a)"/>

  <!-- events back onto the bus -->
  <path class="line" d="M800,254 H480" marker-end="url(#a)"/>
  <rect class="label-bg" x="588" y="236" width="110" height="14" rx="3"/>
  <text class="text" x="643" y="247" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">review.requested</text>

  <path class="line" d="M1045,188 V470 H480" marker-end="url(#a)"/>
  <rect class="label-bg" x="708" y="452" width="104" height="14" rx="3"/>
  <text class="text" x="760" y="463" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">package.verdict</text>

  <text class="text" x="220" y="157" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">released</text>
  <text class="text" x="220" y="344" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">decided</text>

  <!-- dispatcher -->
  <rect class="lambda" x="800" y="340" width="140" height="52" rx="8" stroke-width="1.5"/>
  <text class="text" x="870" y="362" text-anchor="middle" font-size="13" font-weight="600">dispatcher</text>
  <text class="muted" x="870" y="379" text-anchor="middle" font-size="11">Lambda (TypeScript)</text>
  <path class="line" d="M460,366 H800" marker-end="url(#a)"/>
  <path class="line" d="M870,340 V280" marker-end="url(#a)"/>
  <text class="muted" x="880" y="316" font-size="11">callback success</text>
</svg>
